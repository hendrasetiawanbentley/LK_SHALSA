# Render Blueprint: New → Blueprint, pilih repo ini. Atau buat manual sebagai Web Service
# dengan Build/Start Command di bawah.
services:
  - type: web
    name: sikuli
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn webapp.app:app --workers 1 --threads 4 --timeout 300 --bind 0.0.0.0:$PORT
    healthCheckPath: /sehat
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: APP_PASSWORD
        sync: false   # isi sendiri di dashboard Render; tanpa ini halaman terbuka untuk publik
      - key: MAKS_UPLOAD_MB
        value: "200"
