name: analisis

# Menjalankan komparasi LK PDF vs Excel untuk file di input/pdf dan input/excel.
# Jalan otomatis saat input, rules, atau config berubah; bisa juga dijalankan manual
# lewat tab Actions → analisis → Run workflow.
on:
  workflow_dispatch:
    inputs:
      sumber_ai:
        description: "api = panggil Claude lewat ANTHROPIC_API_KEY; rekaman = pakai jawaban AI di folder hasil_ai/"
        type: choice
        options: [otomatis, api, rekaman]
        default: otomatis
  push:
    paths:
      - "input/**"
      - "hasil_ai/**"
      - "rules/**"
      - "config/**"

jobs:
  komparasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Pasang dependensi
        run: pip install -r requirements.txt
      - name: Jalankan analisis
        env:
          # Secret repo (Settings -> Secrets and variables -> Actions). Tanpa secret ini
          # analisis tetap jalan memakai aturan saja.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUMBER_AI: ${{ inputs.sumber_ai || 'otomatis' }}
        # otomatis: pakai API bila secret ada, selain itu pakai rekaman hasil_ai/ (ekstraksi oleh Claude
        # di sesi Claude Code). ai.wajib = true, jadi tanpa keduanya workflow gagal dengan pesan jelas.
        run: |
          if [ "$SUMBER_AI" = "rekaman" ] || { [ "$SUMBER_AI" = "otomatis" ] && [ -z "$ANTHROPIC_API_KEY" ] && [ -d hasil_ai ]; }; then
            PYTHONPATH=src python -m sikuli.lokal --out-dir hasil --ai-rekaman hasil_ai
          else
            PYTHONPATH=src python -m sikuli.lokal --out-dir hasil
          fi
      - name: Buat dashboard HTML
        if: always()
        run: |
          if [ -f hasil/hasil.json ]; then PYTHONPATH=src python scripts/buat_dashboard.py --hasil hasil; fi
      - name: Tampilkan ringkasan di halaman run
        if: always()
        run: |
          if [ -f hasil/ringkasan.md ]; then cat hasil/ringkasan.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Simpan hasil sebagai artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-komparasi
          path: hasil/
          retention-days: 30
          if-no-files-found: warn
