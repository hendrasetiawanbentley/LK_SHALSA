# Konfigurasi pipeline SIKULI. Nilai yang tidak diisi memakai bawaan di
# src/sikuli/config.py. Ganti catalog/schema/path sesuai workspace Databricks.

catalog: sikuli
schema: lk

# Lokasi file sumber di Unity Catalog Volume.
path_pdf: /Volumes/sikuli/lk/sumber/docs/ALL      # LK PDF
path_excel: /Volumes/sikuli/lk/sumber/excel       # LK Excel
# Folder rules: berisi satu file Excel rules (sheet Master). Konfigurasi teknis
# (mapping_seksi.csv, sheet_config.csv) ada di folder config/ ini.
path_rules: rules

entitas:
  # Nama file: JENIS_KODE_keterangan.pdf / .xlsx, mis. "RD_MEES2_1_BNP_Paribas_Obligasi_Kejora_31.12.25.pdf".
  #   doc_type  = bagian pertama (EPP / MI / RD)
  #   entity_id = bagian kedua (kode perusahaan / manajer investasi)
  #   tahun     = angka 4 digit bila ada (informasi saja)
  pola_nama_file: '^(?P<doc_type>EPP|MI|RD)_(?P<entity_id>[A-Za-z0-9]+)(?:_.*?(?P<tahun>(?:19|20)\d{2}))?'
  doc_type_bawaan: null
  # Kriteria tambahan per jenis entitas: akun dan rasio jenis lain di sheet Master ikut dipakai.
  # EPP (emiten) juga dinilai dengan kriteria DES (Daftar Efek Syariah: utang berbasis bunga dan
  # pendapatan non halal) untuk rasio RU dan RPNH.
  kriteria_tambahan:
    EPP: [DES]
  # nama_file: PDF dan Excel dengan nama file yang sama (selain ekstensi) dipasangkan.
  # Diperlukan karena satu kode MI bisa punya beberapa reksa dana (mis. RD_MEES2_1 dan RD_MEES2_18).
  kunci_pasangan: nama_file

deteksi_seksi:
  baris_zona_atas: 8          # jumlah baris teratas halaman yang dicocokkan
  min_seksi_daftar_isi: 3     # >= 3 seksi cocok di satu halaman = daftar isi
  label_tidak_dikenal: tidak_dikenal
  label_daftar_isi: daftar_isi

ekstraksi:
  ai_extract_version: "2.0"   # versi ai_extract (2.0 / 2.1); skema JSON bersarang butuh >= 2.0
  maks_akun_per_panggilan: 40
  maks_karakter_per_seksi: 60000
  seksi_dilewati: []          # seksi yang tidak diambil angkanya (CaLK ikut karena Master memuat akun CaLK, mis. MKBD)

ai:
  # Claude (Anthropic API) dipakai bila aktif DAN secret ANTHROPIC_API_KEY tersedia.
  aktif: true
  # wajib: true = AI harus dipakai. Tanpa ANTHROPIC_API_KEY workflow GAGAL (merah) dengan pesan jelas,
  # dan dokumen yang gagal diproses AI tidak dialihkan ke mode aturan.
  wajib: true
  model: claude-opus-5-5      # mis. claude-sonnet-5-5 / claude-haiku-5-5 untuk biaya lebih rendah
  effort: medium              # low / medium / high / xhigh / max
  fallback_server: true       # bila model menolak (refusal), API mencoba model cadangan otomatis
  maks_token_output: 64000
  maks_mb_pdf: 30             # PDF lebih besar dari ini diproses dengan aturan (batas API 32 MB)
  ekstraksi_pdf: true         # Claude membaca PDF (termasuk hasil scan), seksi, satuan, angka akun
  pemetaan_excel: true        # Claude memetakan label Excel yang tidak dikenali rules
  catatan_dan_kesimpulan: true  # catatan per baris bukan MATCH + kesimpulan dan rekomendasi per entitas
  analisis_rasio: true        # analisis per rasio kertas kerja (config/rasio.yaml), kolom "Analisis AI"
  # OCR: halaman bergambar tanpa lapisan teks (scan) dibaca Claude, hasilnya masuk sheet Teks_PDF
  # (sumber_teks = ocr_claude) dan dipakai untuk verifikasi angka. Ubah ke true untuk mengaktifkan.
  ocr: false
  ocr_halaman_per_permintaan: 10   # jumlah halaman scan per panggilan API

komparasi:
  periode: [berjalan]         # tambah "lalu" untuk ikut membandingkan angka tahun pembanding
  toleransi_absolut: 1        # dalam Rupiah: selisih <= Rp1 dianggap MATCH (dikonversi ke satuan PDF)
  toleransi_relatif: 0.0      # mis. 0.001 = selisih <= 0,1% dianggap MATCH
  # Perbandingan memakai satuan PDF: bila PDF "dalam jutaan", angka Excel dibagi 1.000.000.
  # true = selisih sampai toleransi_pembulatan_satuan (dalam satuan PDF) dianggap pembulatan (MATCH).
  toleransi_pembulatan_skala: true
  toleransi_pembulatan_satuan: 1     # mis. PDF "dalam jutaan": selisih <= 1 juta dianggap MATCH
  # true = beda tanda saja (PDF (5.206) vs Excel 5.206) dianggap MATCH dengan indikasi BEDA_TANDA,
  # sesuai instruksi sheet Master. false = tetap DIFFERENT.
  abaikan_beda_tanda: true
  # true = akun bernilai nihil di satu sisi dan tidak ada/0 di sisi lain dianggap MATCH (indikasi NIHIL).
  nihil_dianggap_match: true
  ai_gen_hanya_non_match: true       # hemat biaya: ai_gen hanya untuk baris bukan MATCH
  catatan_match: Nilai sesuai
