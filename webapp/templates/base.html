<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block judul %}SIKULI{% endblock %}</title>
<style>
:root{--bg:#fff;--fg:#1d2433;--muted:#5b6475;--line:#dde2ea;--card:#f5f7fa;--accent:#13658f;
--ok:#1f7a3a;--okbg:#d9f2e1;--bad:#b42318;--badbg:#fbdad7;--warn:#8a5a00;--warnbg:#fff1c2}
@media (prefers-color-scheme:dark){:root{--bg:#11151c;--fg:#e6e9ef;--muted:#9aa3b2;--line:#2a313d;
--card:#1a2029;--accent:#5fb3e0;--ok:#7fd69a;--okbg:#173524;--bad:#f39a90;--badbg:#3d1f1c;
--warn:#f2c76b;--warnbg:#3a2f12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header,main{max-width:1180px;margin:0 auto;padding:0 16px}
header{padding-top:24px}h1{margin:0;font-size:1.7rem}
nav{display:flex;flex-wrap:wrap;gap:6px 18px;margin:6px 0 18px}
nav a,a{color:var(--accent)}nav a{text-decoration:none;font-weight:600}
h2{margin-top:2rem;border-bottom:1px solid var(--line);padding-bottom:6px}
.muted{color:var(--muted)}
.kartu{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
label{display:block;font-weight:600;margin-top:12px}
input[type=file]{display:block;margin-top:6px;max-width:100%}
button,.tombol{display:inline-block;margin-top:18px;background:var(--accent);color:#fff;border:0;
border-radius:8px;padding:10px 18px;font-size:1rem;font-weight:600;cursor:pointer;text-decoration:none}
.tbl{overflow-x:auto;max-width:100%;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--card);position:sticky;top:0}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.s{font-weight:700;border-radius:999px;padding:1px 8px;white-space:nowrap}
.MATCH{background:var(--okbg);color:var(--ok)}.DIFFERENT{background:var(--badbg);color:var(--bad)}
.PDF_ONLY,.EXCEL_ONLY{background:var(--warnbg);color:var(--warn)}
.angka{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.angka div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.angka b{display:block;font-size:1.6rem}
ul.peringatan{font-size:.9rem}
</style>
</head>
<body>
<header>
<h1>SIKULI</h1>
<p class="muted" style="margin:2px 0 0">Komparasi laporan keuangan PDF vs Excel</p>
<nav><a href="/">Upload</a><a href="/rules">Rules</a></nav>
</header>
<main>{% block isi %}{% endblock %}</main>
</body>
</html>
